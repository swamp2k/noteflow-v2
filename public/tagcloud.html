// ── Embeddings view ───────────────────────────────────────────────────────────
let tcEmbeddingVectors = null; // {tag: number[]} — fetched once, cached

// Voyage AI embeddings — proxied through worker (key stored as VOYAGE_KEY secret)
// input_type: "document" when indexing tags, "query" when searching
async function voyageEmbed(texts, inputType = 'document') {
  const data = await apiPost('/tags/voyage-embed', { texts, input_type: inputType });
  return data.embeddings; // float[][]
}

function cosineSimilarity(a, b) {
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) { dot += a[i]*b[i]; na += a[i]*a[i]; nb += b[i]*b[i]; }
  return dot / (Math.sqrt(na) * Math.sqrt(nb));
}

async function loadEmbeddingsView() {
  const countEl  = document.getElementById('tc-embed-count');
  const indexBtn = document.getElementById('tc-index-btn');
  const reindBtn = document.getElementById('tc-reindex-btn');
  if (!countEl) return;
  countEl.textContent = 'Loading…';
  try {
    const status = await apiGet('/tags/embeddings/status');
    const n = status.indexed, t = status.total;
    countEl.textContent = `${n} / ${t} tags indexed`;
    indexBtn.style.display  = status.missing.length > 0 ? '' : 'none';
    indexBtn.textContent    = `Index ${status.missing.length} tag${status.missing.length === 1 ? '' : 's'}`;
    reindBtn.style.display  = n > 0 ? '' : 'none';
  } catch(e) {
    countEl.textContent = 'Could not load status';
  }
}

async function tcIndexTags() {
  const countEl  = document.getElementById('tc-embed-count');
  const indexBtn = document.getElementById('tc-index-btn');
  indexBtn.disabled = true;
  tcEmbeddingVectors = null; // invalidate cache
  try {
    const status  = await apiGet('/tags/embeddings/status');
    const missing = status.missing.filter(t => !SPECIAL_TAGS.includes(t));
    if (missing.length === 0) {
      countEl.textContent = `${status.indexed} / ${status.total} tags indexed`;
      indexBtn.style.display = 'none';
      return;
    }
    // Fetch note snippets to enrich each tag before embedding
    // e.g. "tag: mazda\nmazda cx-5 service 2023\nmazda forsikring" gives the model real context
    indexBtn.textContent = 'Fetching note contexts…';
    const contexts = await fetch(API_BASE + '/tags/contexts', {
      method: 'POST', credentials: 'omit',
      headers: authHeaders(),
      body: JSON.stringify({ tags: missing })
    }).then(r => r.ok ? r.json() : {}).catch(() => ({}));

    // Voyage supports up to 1000 inputs per request — embed all missing tags at once
    const BATCH = 1000;
    let done = 0;
    for (let i = 0; i < missing.length; i += BATCH) {
      const batch = missing.slice(i, i + BATCH);
      indexBtn.textContent = `Indexing… ${batch.length} tags`;
      // Build enriched strings: "tag: {name}\n{snippet1}\n{snippet2}"
      const enriched = batch.map(tag => {
        const snippets = contexts[tag];
        return snippets?.length ? `tag: ${tag}\n${snippets.join('\n')}` : `tag: ${tag}`;
      });
      const vectors = await voyageEmbed(enriched, 'document');
      const embeddings = batch.map((tag, j) => ({ tag, vector: vectors[j] }));
      await fetch(API_BASE + '/tags/embeddings', {
        method: 'PUT', credentials: 'omit',
        headers: authHeaders(),
        body: JSON.stringify({ embeddings })
      });
      done += batch.length;
    }
    countEl.textContent = `${status.indexed + done} / ${status.total} tags indexed`;
    indexBtn.style.display  = 'none';
    document.getElementById('tc-reindex-btn').style.display = '';
    toast(`Indexed ${done} tags`);
  } catch(e) {
    toast('Indexing failed: ' + e.message);
    console.error('[embeddings]', e);
    indexBtn.disabled = false;
    indexBtn.textContent = 'Retry';
  }
}

async function tcClearAndReindex() {
  if (!confirm('Clear all stored embeddings and re-index from scratch?')) return;
  await fetch(API_BASE + '/tags/embeddings', { method: 'DELETE', credentials: 'omit', headers: authHeaders() });
  tcEmbeddingVectors = null;
  await loadEmbeddingsView();
  tcIndexTags();
}

let _embedSearchTimer = null;
document.getElementById('tc-embed-search').addEventListener('input', e => {
  clearTimeout(_embedSearchTimer);
  _embedSearchTimer = setTimeout(() => tcSearchEmbeddings(e.target.value), 500);
});

async function tcSearchEmbeddings(query) {
  const resultsEl = document.getElementById('tc-embed-results');
  const hintEl    = document.getElementById('tc-embed-hint');
  if (!query.trim()) {
    resultsEl.innerHTML = '';
    hintEl.style.display = '';
    return;
  }
  hintEl.style.display = 'none';
  resultsEl.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px 0">Searching…</div>';
  try {
    if (!tcEmbeddingVectors) {
      const data = await apiGet('/tags/embeddings');
      tcEmbeddingVectors = {};
      for (const { tag, vector } of data.embeddings) {
        tcEmbeddingVectors[tag] = typeof vector === 'string' ? JSON.parse(vector) : vector;
      }
    }
    if (Object.keys(tcEmbeddingVectors).length === 0) {
      resultsEl.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px 0">No indexed tags yet — click "Index tags" first.</div>';
      return;
    }
    const [queryVec] = await voyageEmbed([query], 'query');
    const tagCounts = {};
    (tagGraphData?.tags || []).forEach(t => { tagCounts[t.tag] = t.count; });
    const results = Object.entries(tcEmbeddingVectors)
      .map(([tag, vec]) => ({ tag, score: cosineSimilarity(queryVec, vec), count: tagCounts[tag] || 0 }))
      .sort((a, b) => b.score - a.score)
      .slice(0, 15);
    renderEmbeddingResults(results);
  } catch(e) {
    resultsEl.innerHTML = `<div style="color:var(--danger);font-size:13px;padding:8px 0">${e.message}</div>`;
  }
}

function renderEmbeddingResults(results, headline) {
  const resultsEl = document.getElementById('tc-embed-results');
  const hintEl    = document.getElementById('tc-embed-hint');
  if (!resultsEl) return;
  if (results.length === 0) { resultsEl.innerHTML = ''; return; }
  if (hintEl) hintEl.style.display = 'none';
  const maxScore = results[0].score || 1;
  const headHtml = headline ? `<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:4px;font-family:'IBM Plex Mono',monospace">${headline}</div>` : '';
  resultsEl.innerHTML = headHtml + results.map(({ tag, score, count }, i) => {
    const pct = (score / maxScore * 100).toFixed(1);
    const safeTag = tag.replace(/"/g,'&quot;');
    return `<div class="tc-embed-result" data-tag="${safeTag}">
      <div class="tc-embed-result-rank">${i+1}</div>
      <div class="tc-embed-result-tag">#${tag}</div>
      <div class="tc-embed-result-bar-wrap"><div class="tc-embed-result-bar" style="width:${pct}%"></div></div>
      <div class="tc-embed-result-score">${score.toFixed(3)}</div>
      <div class="tc-embed-result-count">${count} note${count !== 1 ? 's' : ''}</div>
      <button class="tc-embed-graph-btn" data-tag="${safeTag}" title="Show ego graph">⊛</button>
    </div>`;
  }).join('');
}

document.getElementById('tc-embed-results').addEventListener('click', e => {
  // "Show in graph" button → ego graph
  const graphBtn = e.target.closest('.tc-embed-graph-btn');
  if (graphBtn) { buildEgoGraph(graphBtn.dataset.tag); return; }
  // Row click → hop to that tag (re-search from it)
  const row = e.target.closest('[data-tag]');
  if (!row) return;
  const tag = row.dataset.tag;
  const searchEl = document.getElementById('tc-embed-search');
  if (searchEl) searchEl.value = tag;
  tcSearchEmbeddings(tag);
});

// ── Ego graph — focused subgraph around one tag ───────────────────────────────
async function buildEgoGraph(centralTag) {
  if (!tcEmbeddingVectors || !tcEmbeddingVectors[centralTag]) {
    toast('Tag not yet indexed — run Index tags first'); return;
  }
  // Ensure graph data and D3 are loaded
  if (!tagGraphData) await loadTagCloud();
  const centralVec = tcEmbeddingVectors[centralTag];
  const tagCountMap = {};
  (tagGraphData?.tags || []).forEach(t => { tagCountMap[t.tag] = t.count; });

  // Top 9 semantic neighbors
  const neighbors = Object.entries(tcEmbeddingVectors)
    .filter(([t]) => t !== centralTag)
    .map(([t, v]) => ({ tag: t, score: cosineSimilarity(centralVec, v) }))
    .sort((a, b) => b.score - a.score)
    .slice(0, 9);

  const egoTags = [centralTag, ...neighbors.map(n => n.tag)];
  const egoNodes = egoTags.map(tag => ({ tag, count: tagCountMap[tag] || 1 }));

  // Semantic edges: center→all neighbors always; neighbor↔neighbor if sim > 0.6
  const edges = [];
  for (let i = 0; i < egoTags.length; i++) {
    for (let j = i + 1; j < egoTags.length; j++) {
      const a = egoTags[i], b = egoTags[j];
      const sim = cosineSimilarity(tcEmbeddingVectors[a], tcEmbeddingVectors[b]);
      if (i === 0 || sim > 0.60) {
        edges.push({ source: a, target: b, weight: Math.round(sim * 10) });
      }
    }
  }

  setTcMode('network');           // clears tcEgoData — must set it after
  tcEgoData = { tags: egoNodes, edges, center: centralTag };
  if (tcSvg) buildForceGraph();
  else loadTagCloud();
}

function tcClearEgo() {
  tcEgoData = null;
  if (tcSvg) buildForceGraph();
  else loadTagCloud();
}

// ── Surprise me — k-means clustering on embedding vectors ─────────────────────
function kMeans(vectors, k, iterations = 50) {
  const tags = Object.keys(vectors);
  const vecs = tags.map(t => vectors[t]);
  const dim  = vecs[0].length;

  // k-means++ initialisation
  const centroids = [vecs[Math.floor(Math.random() * vecs.length)].slice()];
  while (centroids.length < k) {
    const dists = vecs.map(v => Math.min(...centroids.map(c => {
      let d = 0; for (let i = 0; i < dim; i++) d += (v[i]-c[i])**2; return d;
    })));
    const sum = dists.reduce((a,b) => a+b, 0);
    let r = Math.random() * sum;
    for (let i = 0; i < dists.length; i++) { r -= dists[i]; if (r <= 0) { centroids.push(vecs[i].slice()); break; } }
  }

  let assignments = new Array(tags.length).fill(0);
  for (let iter = 0; iter < iterations; iter++) {
    // Assign
    assignments = vecs.map(v => {
      let best = 0, bestD = Infinity;
      for (let c = 0; c < k; c++) {
        let d = 0; for (let i = 0; i < dim; i++) d += (v[i]-centroids[c][i])**2;
        if (d < bestD) { bestD = d; best = c; }
      }
      return best;
    });
    // Update centroids
    for (let c = 0; c < k; c++) {
      const members = assignments.reduce((a, asgn, i) => asgn === c ? [...a, vecs[i]] : a, []);
      if (!members.length) continue;
      for (let i = 0; i < dim; i++) centroids[c][i] = members.reduce((s, v) => s + v[i], 0) / members.length;
    }
  }

  // Group tags by cluster; name each by the tag closest to its centroid
  const clusters = Array.from({length: k}, (_, c) => {
    const members = tags.filter((_, i) => assignments[i] === c);
    const centroid = centroids[c];
    const label = members.reduce((best, tag) => {
      const v = vectors[tag];
      let d = 0; for (let i = 0; i < dim; i++) d += (v[i]-centroid[i])**2;
      const bv = vectors[best];
      let bd = 0; for (let i = 0; i < dim; i++) bd += (bv[i]-centroid[i])**2;
      return d < bd ? tag : best;
    }, members[0]);
    return { label, members };
  }).filter(c => c.members.length > 0)
    .sort((a, b) => b.members.length - a.members.length);

  return clusters;
}

const CLUSTER_COLORS = ['#5b9bd5','#4a9e72','#c49a3c','#9b7fd4','#c2405a','#1a7fa8','#56c4a0','#c17f3e'];

async function tcSurpriseMe() {
  const resultsEl = document.getElementById('tc-embed-results');
  const hintEl    = document.getElementById('tc-embed-hint');
  const searchEl  = document.getElementById('tc-embed-search');

  // Load embeddings from DB if not yet cached in this session
  if (!tcEmbeddingVectors) {
    if (hintEl) hintEl.textContent = 'Loading embeddings…';
    try {
      const data = await apiGet('/tags/embeddings');
      tcEmbeddingVectors = {};
      for (const { tag, vector } of data.embeddings) {
        tcEmbeddingVectors[tag] = typeof vector === 'string' ? JSON.parse(vector) : vector;
      }
    } catch(e) { toast('Failed to load embeddings: ' + e.message); return; }
    if (hintEl) hintEl.textContent = 'Type a concept above to find semantically related tags, or try Surprise me';
  }
  if (Object.keys(tcEmbeddingVectors).length < 4) {
    toast('Index tags first, then try Surprise me'); return;
  }
  if (searchEl) searchEl.value = '';
  if (hintEl)   hintEl.style.display = 'none';

  const filtered = Object.fromEntries(
    Object.entries(tcEmbeddingVectors).filter(([t]) => !SPECIAL_TAGS.includes(t))
  );
  const n = Object.keys(filtered).length;
  const k = Math.min(8, Math.max(4, Math.round(Math.sqrt(n / 2))));
  const tagCounts = {};
  (tagGraphData?.tags || []).forEach(t => { tagCounts[t.tag] = t.count; });

  const clusters = kMeans(filtered, k);

  resultsEl.innerHTML = `<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:12px;font-family:'IBM Plex Mono',monospace">
    Auto-discovered ${clusters.length} clusters from ${n} tags
  </div>` + clusters.map((cl, ci) => {
    const color = CLUSTER_COLORS[ci % CLUSTER_COLORS.length];
    const memberHtml = cl.members
      .sort((a,b) => (tagCounts[b]||0) - (tagCounts[a]||0))
      .map(tag => {
        const safe = tag.replace(/"/g,'&quot;');
        return `<span class="tc-cluster-tag" data-tag="${safe}" style="border-color:${color}33;color:${color}">#${tag}</span>`;
      }).join('');
    return `<div class="tc-cluster-card">
      <div class="tc-cluster-header" style="color:${color}">
        <span style="width:8px;height:8px;border-radius:50%;background:${color};display:inline-block;margin-right:6px"></span>
        ${cl.label}
        <span style="font-size:11px;opacity:0.6;margin-left:6px">${cl.members.length} tags</span>
      </div>
      <div class="tc-cluster-tags">${memberHtml}</div>
    </div>`;
  }).join('');

  // Tag clicks → search from that tag
  resultsEl.querySelectorAll('.tc-cluster-tag').forEach(el => {
    el.addEventListener('click', () => {
      if (searchEl) searchEl.value = el.dataset.tag;
      tcSearchEmbeddings(el.dataset.tag);
    });
  });
}
