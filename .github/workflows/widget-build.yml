name: Android Widget Build

on:
  push:
    branches: [main]
    paths:
      - 'noteflow-widget/**'
      - '.github/workflows/widget-build.yml'
  pull_request:
    paths:
      - 'noteflow-widget/**'
      - '.github/workflows/widget-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Native debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noteflow-widget

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Lint, test and build APK
        run: gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: noteflow-widget-debug
          path: noteflow-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
